name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck-syntax:
    name: Shell script syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: bash -n every .sh file
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' f; do
            echo "Checking: $f"
            bash -n "$f" || status=1
          done < <(find . -name '*.sh' -not -path './Novus-Agenti/*' -print0)
          exit "$status"

  hook-tests:
    name: Hook test suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Termux bash shim (hook shebangs) and gitleaks
        run: |
          set -euo pipefail
          sudo mkdir -p /data/data/com.termux/files/usr/bin
          sudo ln -sf "$(command -v bash)" /data/data/com.termux/files/usr/bin/bash
          curl -sSL -o /tmp/gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -C /tmp -xzf /tmp/gl.tgz gitleaks && sudo install -m755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run every suite
        run: |
          set -uo pipefail
          cd hooks/tests
          fail=0
          for t in *.test.sh test-*.sh; do
            echo "=================== $t"
            if ! timeout 300 bash "$t"; then echo "SUITE FAILED: $t"; fail=1; fi
          done
          exit $fail

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ""
