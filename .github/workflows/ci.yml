name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck-syntax:
    name: Shell script syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: bash -n every .sh file
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' f; do
            echo "Checking: $f"
            bash -n "$f" || status=1
          done < <(find . -name '*.sh' -not -path './Novus-Agenti/*' -print0)
          exit "$status"

  hook-tests:
    name: Hook test suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Contract enforcement plugin tests
        # The old hooks/tests folder was removed with the old gates (98e89e6); the rules now live in the plugin.
        # One process per file: lib/contract.py reads HOME and the state path once, at import, and each test file
        # sets its own temporary HOME first. In one shared process (unittest discover) the first file's HOME sticks.
        run: |
          set -e
          for f in plugins/aesops-enforcements/tests/test_*.py; do
            echo "== $f"
            python3 -I "$f"
          done

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ""
